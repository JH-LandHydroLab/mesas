[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mesas"
version = "2.0.1"
description = "MESAS - Multiscale Estimation of StorAge Selection."
readme = "README.md"
authors = [
  {email = "charman1@jhu.edu"},
  {name = "Ciaran J. Harman"}
]
maintainers = [
  {email = "charman1@jhu.edu"},
  {name = "Ciaran J. Harman"}
]
keywords = [
  "hydrology",
  "SAS",
  "Storage selection functions",
]
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy>1.22",
  "numba",
  "scipy",
  "matplotlib"
]

[project.optional-dependencies]
# scikit-learn is needed only by mesas.me.recursive_split (SAS function estimation)
estimation = [
  "scikit-learn",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "sphinx-copybutton",
]
test = [
  "pytest>=7.0",
  "pytest-cov",
  "hypothesis",
  "scikit-learn",
]

[project.urls]
homepage = "https://mesas.readthedocs.io/"
documentation = "https://mesas.readthedocs.io/"
repository = "https://github.com/JH-LandHydroLab/mesas"

[tool.hatch.build.targets.wheel]
packages = ["mesas"]
exclude = ["mesas/dev"]

[tool.hatch.build.targets.sdist]
include = [
  "mesas",
  "test",
  "doc",
  "examples/*.py",
  "examples/*.csv",
  "LICENSE.txt",
  "README.md",
  "CITATION.cff",
]
exclude = ["mesas/dev"]


[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["mesas"]
omit = ["mesas/me/*", "mesas/dev/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Cell-based (# %%) tutorial scripts introduce imports as the narrative needs them.
"examples/*.py" = ["E402"]
# Legacy animation demo predating the refactor; lint-exempt until modernized.
"examples/benchmark/animate_benchmark.py" = ["F841", "E731", "F821"]
# Legacy benchmark scripts predating the refactor; lint-exempt until
# they are consolidated into the curated test suites.
"test/test_time.py" = ["W191", "F811", "F821", "F841", "E741"]
"test/test_time2.py" = ["W191", "F811", "F821", "F841", "E741"]
"test/test_benchmark.py" = ["W191", "F811", "F821", "F841", "E741"]
"test/test_benchmark2.py" = ["W191", "F811", "F821", "F841", "E741"]
"test/test_evapoconcentration.py" = ["W191", "F811", "F821", "F841", "E741"]
